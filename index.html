<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SuperClean Pro - Reinigungsprotokoll</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
    
    body {
      font-family: 'Inter', system_ui, sans-serif;
    }
    
    /* Force Light Mode */
    body, .bg-white, .bg-slate-50, .bg-slate-100 {
      background-color: #ffffff !important;
    }
    
    .dark\:bg-slate-900, .dark\:bg-slate-800, .dark\:bg-slate-700 {
      background-color: #ffffff !important;
    }
    
    .text-slate-500, .text-slate-600, .text-slate-700 {
      color: #334155 !important;
    }
    
    h1, h2, h3, h4, h5, h6 {
      color: #0f172a !important;
    }
    
    .signature-canvas {
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05);
    }
    
    .room-card {
      min-height: 140px;
    }
    
    @media (max-width: 640px) {
      .room-card {
        min-height: 120px;
        padding: 1rem;
      }
      
      .room-card .text-5xl {
        font-size: 2.5rem;
      }
      
      .room-card .text-xl {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body class="bg-white">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between px-8 py-6 border-b">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-[#FF385C] rounded-2xl flex items-center justify-center">
          <i class="fa-solid fa-broom text-white text-3xl"></i>
        </div>
        <div>
          <h1 class="text-4xl font-bold tracking-tight">SuperClean Pro</h1>
          <p class="text-sm text-slate-500 -mt-1">Airbnb Reinigungsprotokoll</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <div class="px-4 py-1.5 bg-emerald-100 text-emerald-700 rounded-full text-sm font-medium flex items-center gap-2">
          <i class="fa-solid fa-check-circle"></i>
          <span>Online</span>
        </div>
        <div class="w-9 h-9 bg-slate-200 rounded-full flex items-center justify-center">
          <span class="font-semibold text-sm">MS</span>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div id="nav-tabs" class="flex items-center gap-1 px-8 py-4 border-b bg-white sticky top-0 z-50">
      <!-- JS injected -->
    </div>

    <!-- Main Content -->
    <div id="main-content" class="px-8 py-8">
      <!-- JS injected -->
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
