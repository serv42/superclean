<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperClean Pro • Reinigungsprotokoll</title>
  <meta name="description" content="Professionelles Reinigungsprotokoll für Airbnb & Ferienwohnungen">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%A7%B9%3C/text%3E%3C/svg%3E">
  
  <!-- Tailwind CSS - Local first, CDN fallback -->
  <link rel="stylesheet" href="css/tailwind.min.css" onerror="this.onerror=null;this.href='https://cdn.tailwindcss.com';">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --primary: #FF385C;
    }
    
    .room-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .room-card:active {
      transform: scale(0.97);
    }
    
    .slide-in-right {
      animation: slideInRight 0.3s ease forwards;
    }
    
    @keyframes slideInRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    
    .bottom-nav-item {
      transition: color 0.2s ease;
    }
    
    .history-item {
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    
    .history-item:active {
      transform: scale(0.985);
    }
    
    .modal {
      animation: modalPop 0.2s ease forwards;
    }
    
    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="main-content" class="min-h-screen pb-20"></div>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <!-- Main App -->
  <script type="module" src="js/main.js"></script>
  
  <script>
    // Tailwind Play CDN fallback (only if local fails)
    if (!document.querySelector('link[href*="tailwind"]')) {
      const script = document.createElement('script');
      script.src = 'https://cdn.tailwindcss.com';
      script.onload = () => {
        console.log('%c[Tailwind] CDN fallback loaded', 'color:#10b981');
      };
      document.head.appendChild(script);
    }
  </script>
</body>
</html>
