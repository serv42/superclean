<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SuperClean Pro - Reinigungsprotokoll</title>
  
  <!-- Local Tailwind JS JIT Compiler -->
  <script src="js/tailwind.js"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    
    body {
      font-family: 'Inter', system_ui, sans-serif;
    }
    
    .signature-canvas {
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05);
    }
    
    .room-card {
      min-height: 140px;
    }
  </style>
</head>
<body class="bg-white">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between px-4 sm:px-8 py-5 border-b">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 sm:w-12 sm:h-12 bg-[#FF385C] rounded-2xl flex items-center justify-center flex-shrink-0">
          <i class="fa-solid fa-broom text-white text-2xl sm:text-3xl"></i>
        </div>
        <div>
          <h1 class="text-2xl sm:text-4xl font-bold tracking-tight">SuperClean Pro</h1>
          <p class="text-xs sm:text-sm text-slate-500 -mt-0.5">Airbnb Reinigungsprotokoll</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2 sm:gap-3">
        <div class="px-3 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs sm:text-sm font-medium flex items-center gap-1.5">
          <i class="fa-solid fa-check-circle text-xs"></i>
          <span class="hidden sm:inline">Online</span>
        </div>
        <div class="w-8 h-8 sm:w-9 sm:h-9 bg-slate-200 rounded-full flex items-center justify-center">
          <span class="font-semibold text-xs sm:text-sm">MS</span>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div id="nav-tabs" class="flex items-center gap-1 px-4 sm:px-8 py-3 border-b bg-white sticky top-0 z-50">
      <!-- JS injected -->
    </div>

    <!-- Main Content -->
    <div id="main-content" class="px-4 sm:px-8 py-6">
      <!-- JS injected -->
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
