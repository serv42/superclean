<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperClean • Airbnb Protokoll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100">
    <!-- Navbar -->
    <nav class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-x-3">
                    <div class="w-10 h-10 bg-emerald-600 rounded-2xl flex items-center justify-center">
                        <i class="fa-solid fa-broom text-white text-2xl"></i>
                    </div>
                    <div>
                        <span class="font-bold text-2xl">SuperClean</span>
                        <span class="text-emerald-600 text-sm font-medium">Pro</span>
                    </div>
                </div>
                
                <div class="flex items-center gap-x-1 text-sm" id="nav-tabs">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-8" id="main-content">
        <!-- Content loaded dynamically by components -->
    </div>

    <!-- Modals -->
    <div id="modal-container"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
