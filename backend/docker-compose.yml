version: '3.8'

services:
  php:
    image: php:8.2-apache
    container_name: superclean-api
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html
      - ./config:/var/www/html/config
    environment:
      - PHP_INI_DIR=/usr/local/etc/php
    restart: unless-stopped

